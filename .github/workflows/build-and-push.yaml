name: Build and Push Auth MS to GHCR

on:
  push:
    branches:
      - main # Ejecuta este flujo cuando se suben cambios a la rama 'main'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres_db:
        image: postgres:13 # Usamos una imagen de postgres ligera
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # -----------------------------------

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for PostgreSQL service to be healthy
        uses: jakejarvis/wait-for-carbon-service@master
        with:
          timeout: 60s
          check_url: localhost:5432

      - name: Build the microservice with Maven
        # --- PASAMOS LAS VARIABLES DE ENTORNO PARA LAS PRUEBAS ---
        run: ./mvnw clean install
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Usa tu usuario de GitHub
          password: ${{ secrets.GITHUB_TOKEN }} # Usa el token automático de GitHub

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Etiqueta la imagen con el formato correcto de GHCR (ghcr.io/usuario/repo)
          tags: ghcr.io/${{ github.repository }}:latest