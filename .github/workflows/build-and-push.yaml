name: Build and Push Auth MS to GHCR

on:
  push:
    branches:
      - main # Ejecuta este flujo cuando se suben cambios a la rama 'main'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ESTE PERMISO ES CLAVE para subir al GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build the microservice with Maven
        run: ./mvnw clean install

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Usa tu usuario de GitHub
          password: ${{ secrets.GITHUB_TOKEN }} # Usa el token automático de GitHub

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Etiqueta la imagen con el formato correcto de GHCR (ghcr.io/usuario/repo)
          tags: ghcr.io/${{ github.repository }}:latest