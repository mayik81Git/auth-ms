apiVersion: v1
kind: Service
metadata:
  name: auth-ms-service
spec:
  selector:
    app: auth-ms # <-- Empareja con el label del Deployment
  type: ClusterIP # <-- Solo accesible internamente
  ports:
    - protocol: TCP
      port: 80 # Puerto del Service
      targetPort: 8081 # Puerto del contenedor